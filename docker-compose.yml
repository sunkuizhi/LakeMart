version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: lakemart-mysql
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lakemart
    volumes:
      - ./mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - lakemart-net

  redis:
    image: redis:7-alpine
    container_name: lakemart-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    networks:
      - lakemart-net
#  大数据
  zookeeper:
    image: zookeeper:3.7
    container_name: lakemart-zookeeper
    ports:
      - "2181:2181"
    networks:
      - lakemart-net

  kafka:
    image: wurstmeister/kafka:latest
    container_name: lakemart-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "user-actions:1:1"
    ports:
      - "9092:9092"
    networks:
      - lakemart-net
  spark:
    image: apache/spark:3.4.1-scala2.12-java17-python3-ubuntu
    container_name: lakemart-spark
    depends_on:
      - kafka
      - redis
    volumes:
      - ./lakemart-spark/target/lakemart-spark.jar:/app/lakemart-spark.jar
      - ./data/spark-checkpoints:/tmp/spark/checkpoints
    command: >
      /opt/spark/bin/spark-submit
      --class com.lakemart.spark.HotItemsStreaming
      --master local[*]
      /app/lakemart-spark.jar
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - REDIS_HOST=redis
  minio:
    image: minio/minio
    container_name: lakemart-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - lakemart-net

  backend:
    image: lakemart-server:latest
    container_name: lakemart-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      # 关键：添加 allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/lakemart?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESSKEY: minioadmin
      MINIO_SECRETKEY: minioadmin
      MINIO_BUCKETNAME: lakemart
      JWT_SECRET: your-256-bit-secret-key-for-jwt-lakemart-project-2026
      JWT_EXPIRATION: 86400000
    depends_on:
      - mysql
      - redis
      - minio
    networks:
      - lakemart-net

  admin-frontend:
    image: lakemart-admin:latest
    container_name: lakemart-admin
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - lakemart-net

  client-frontend:
    image: lakemart-client:latest
    container_name: lakemart-client
    restart: always
    ports:
      - "5174:80"
    depends_on:
      - backend
    networks:
      - lakemart-net

networks:
  lakemart-net:
    driver: bridge

