services:
  mysql:
    image: mysql:8
    container_name: lakemart-mysql
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lakemart
    volumes:
      - ./mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - lakemart-net

  redis:
    image: redis:7-alpine
    container_name: lakemart-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    networks:
      - lakemart-net

  zookeeper:
    image: zookeeper:3.7
    container_name: lakemart-zookeeper
    ports:
      - "2181:2181"
    networks:
      - lakemart-net

  kafka:
    image: wurstmeister/kafka:latest
    container_name: lakemart-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_ADVERTISED_HOST_NAME: localhost
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "user-actions:1:1"
    ports:
      - "9092:9092"
    networks:
      - lakemart-net

  minio:
    image: minio/minio
    container_name: lakemart-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - lakemart-net

  # ========== Spring Boot 后端 ==========
  lakemart-server:
    build:
      context: ./lakemart-server
      dockerfile: Dockerfile
    container_name: lakemart-server
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://lakemart-mysql:3306/lakemart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_REDIS_HOST=lakemart-redis
      - SPRING_REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=lakemart-kafka:9092
      - ZHIPUAI_API_KEY=${ZHIPUAI_API_KEY}
    depends_on:
      - mysql
      - redis
      - kafka
    networks:
      - lakemart-net

  # ========== AI Agent 服务 ==========
  agent:
    build:
      context: ./lakemart-agent
      dockerfile: Dockerfile
    container_name: lakemart-agent
    restart: always
    ports:
      - "8081:8081"
    environment:
      - LAKEMART_SERVER_URL=http://lakemart-server:8080
      - REDIS_URL=redis://lakemart-redis:6379/0
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - APP_HOST=0.0.0.0
      - APP_PORT=8081
      - LOG_LEVEL=INFO
    depends_on:
      - redis
      - lakemart-server
    networks:
      - lakemart-net

